name: Refine white client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: oven-sh/setup-bun@v2
      - name: Install tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Rebuild detailed white variants from original artwork
        run: |
          mkdir -p /tmp/original-detail-logos /tmp/refined-white-validation
          for n in claro leo-madeiras frota procria; do
            git show 8c487e5e0b13deb3f21e60e2ebd5735922abbb09:public/client-logos/$n.png > /tmp/original-detail-logos/$n.png
          done
          python - <<'PY'
          from pathlib import Path
          from collections import deque
          from PIL import Image, ImageDraw

          SRC=Path('/tmp/original-detail-logos')
          OUT=Path('public/client-logos')

          def components(mask,w,h):
              seen=bytearray(w*h); comps=[]
              for y in range(h):
                  for x in range(w):
                      idx=y*w+x
                      if not mask[idx] or seen[idx]: continue
                      q=deque([idx]); seen[idx]=1; comp=[]
                      while q:
                          i=q.popleft(); comp.append(i); cx=i%w; cy=i//w
                          for nx,ny in ((cx-1,cy),(cx+1,cy),(cx,cy-1),(cx,cy+1)):
                              if 0<=nx<w and 0<=ny<h:
                                  ni=ny*w+nx
                                  if mask[ni] and not seen[ni]: seen[ni]=1; q.append(ni)
                      comps.append(comp)
              return comps

          def boundary_of(comp_set,w,h,thickness=2):
              edge=set()
              current=set(comp_set)
              for _ in range(thickness):
                  layer=set()
                  for i in current:
                      x=i%w; y=i//w
                      for nx,ny in ((x-1,y),(x+1,y),(x,y-1),(x,y+1)):
                          if not (0<=nx<w and 0<=ny<h) or (ny*w+nx) not in comp_set:
                              layer.add(i); break
                  edge |= layer
                  current -= layer
              return edge

          def make_white_from_original(name, bg_selector, keep_outline=True, restrict=None):
              img=Image.open(SRC/f'{name}.png').convert('RGBA')
              w,h=img.size; px=list(img.getdata())
              candidate=bytearray(w*h)
              for y in range(h):
                  for x in range(w):
                      i=y*w+x; r,g,b,a=px[i]
                      if a<=8: continue
                      if restrict and not restrict(x,y,w,h): continue
                      if bg_selector(r,g,b,a): candidate[i]=1
              comps=components(candidate,w,h)
              if not comps: raise RuntimeError(f'{name}: no background component detected')
              largest=max(comps,key=len); bg=set(largest)
              edge=boundary_of(bg,w,h,2) if keep_outline else set()
              out=[]
              for i,(r,g,b,a) in enumerate(px):
                  if a<=6: out.append((255,255,255,0)); continue
                  if i in bg and i not in edge:
                      out.append((255,255,255,0))
                  else:
                      out.append((255,255,255,a))
              result=Image.new('RGBA',(w,h)); result.putdata(out); result.save(OUT/f'{name}.png','PNG',optimize=True)
              print(name,'removed background pixels',len(bg)-len(edge),'outline',len(edge))

          # Claro: remove the red button fill, preserve a clean white circular outline plus the original white word/rays.
          make_white_from_original('claro', lambda r,g,b,a: r>105 and r>g*1.35 and r>b*1.35, keep_outline=True)
          # Leo Madeiras: remove the green badge fill but keep its outline, yellow lettering and subtitle.
          make_white_from_original('leo-madeiras', lambda r,g,b,a: g>55 and g>r*1.08 and g>b*1.10, keep_outline=True)
          # Frota: remove only the dark-blue upper badge fill; preserve its border, internal F and all text below.
          make_white_from_original('frota', lambda r,g,b,a: b>45 and b>r*1.12 and b>g*1.02, keep_outline=True, restrict=lambda x,y,w,h: y < h*0.62)
          # Procria: remove the white oval fill; keep the green/dark oval rings, PROCRIA lettering and subtitle.
          make_white_from_original('procria', lambda r,g,b,a: min(r,g,b)>205 and max(r,g,b)-min(r,g,b)<42, keep_outline=False)

          # Validate every final client asset remains strictly white + alpha.
          files=sorted(OUT.glob('*.png'))
          if len(files)!=17: raise RuntimeError(f'Expected 17 PNG assets, got {len(files)}')
          panels=[]
          for p in files:
              im=Image.open(p).convert('RGBA')
              amin,amax=im.getchannel('A').getextrema()
              if amin!=0 or amax==0: raise RuntimeError(f'{p.name}: invalid alpha {amin}-{amax}')
              for r,g,b,a in im.getdata():
                  if a>0 and (r,g,b)!=(255,255,255): raise RuntimeError(f'{p.name}: non-white pixel')
              panel=Image.new('RGB',(420,130),'#090909'); logo=im.copy(); logo.thumbnail((350,82),Image.Resampling.LANCZOS)
              panel.paste(logo,((420-logo.width)//2,(130-logo.height)//2),logo); panels.append((p.stem,panel))
          cols=3; rows=(len(panels)+cols-1)//cols
          sheet=Image.new('RGB',(420*cols,130*rows),'#090909'); draw=ImageDraw.Draw(sheet)
          for i,(name,panel) in enumerate(panels):
              x=(i%cols)*420; y=(i//cols)*130; sheet.paste(panel,(x,y)); draw.text((x+10,y+8),name,fill='white')
          sheet.save('/tmp/refined-white-validation/refined-white-logos-dark-bg.png')
          PY

      - name: Build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate browser rendering
        run: |
          bunx vite dev --host 127.0.0.1 --port 4173 > /tmp/vite-refined-white.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 30 ]; then cat /tmp/vite-refined-white.log; exit 1; fi
            sleep 1
          done
          python - <<'PY'
          from pathlib import Path
          import time
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          out=Path('/tmp/refined-white-validation')
          for name,width,height in [('desktop',1440,900),('mobile',390,844)]:
              opts=Options(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-gpu'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument(f'--window-size={width},{height}')
              d=webdriver.Chrome(options=opts)
              try:
                  d.set_window_size(width,height); d.get('http://127.0.0.1:4173/')
                  section=WebDriverWait(d,30).until(EC.presence_of_element_located((By.CSS_SELECTOR,'.client-logos')))
                  WebDriverWait(d,30).until(lambda x:x.execute_script("return [...document.querySelectorAll('.client-logos img')].every(i=>i.complete&&i.naturalWidth>0)"))
                  state=d.execute_script("return {count:document.querySelectorAll('.client-logos-group:not([data-clone=\"true\"]) img').length,overflow:document.documentElement.scrollWidth>document.documentElement.clientWidth}")
                  if state['count']!=17 or state['overflow']: raise RuntimeError(f'{name}: invalid state {state}')
                  track=d.find_element(By.CSS_SELECTOR,'.client-logos-track')
                  d.execute_script("arguments[0].scrollIntoView({block:'center'});arguments[1].style.animationPlayState='paused';",section,track); time.sleep(.3)
                  d.save_screenshot(str(out/f'refined-marquee-{name}.png'))
                  print('VALID',name,state)
              finally: d.quit()
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: refined-white-logo-validation
          path: /tmp/refined-white-validation

      - name: Commit refined white logo assets
        run: |
          rm -f .github/workflows/refine-white-client-logos.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: preserve details in white client logos"
          git push origin main
