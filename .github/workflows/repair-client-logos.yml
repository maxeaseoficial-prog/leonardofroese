name: Repair client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore generator and reconstruct one consistent historical source
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output(
              ['git', 'show', '03a1c3c28e1c5165b2a94316b3eb9a31b18a5cd7:.github/workflows/repair-client-logos.yml'],
              text=True,
          )
          start = "          cat > /tmp/split_client_logos.py <<'PY'\n"
          end = "\n          PY\n"
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace('import io\n', 'import io\nimport re\nimport subprocess\n')
          old = "raw_b64 = (out / 'clients-strip.b64.txt').read_text(encoding='utf-8').strip()"
          source_commit = '9cd591fff9891082b1ba8cbde3d4276521c6282a'
          new = f"source_commit = '{source_commit}'\nparts = []\nfor index in range(8):\n    chunk_text = subprocess.check_output(['git', 'show', f'{{source_commit}}:src/assets/client-logo-strip/chunk{{index}}.ts'], text=True)\n    match = re.search(r'\\\"([^\\\"]+)\\\"', chunk_text)\n    if not match:\n        raise RuntimeError(f'Could not parse historical chunk{{index}}.ts')\n    parts.append(match.group(1))\nraw_b64 = ''.join(parts)\nraw_b64 += '=' * (-len(raw_b64) % 4)\nprint(f'Reconstructed source from one historical revision; chunks={{len(parts)}}, padded base64 chars={{len(raw_b64)}}')"
          if old not in script:
              raise SystemExit('Source line to patch was not found')
          script = script.replace(old, new)
          Path('/tmp/split_client_logos.py').write_text(script, encoding='utf-8')
          print('Generator restored using all eight chunks from the same historical commit.')
          PYEXTRACT
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate individual transparent assets
        run: python /tmp/split_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Build project
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix: use individual transparent client logos"
          git push origin main
