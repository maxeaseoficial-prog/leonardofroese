name: Repair client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore repair script from previous revision
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/repair-client-logos.yml'],
              text=True,
          )
          start = "          cat > /tmp/repair_client_logos.py <<'PY'\n"
          end = "\n          PY\n"
          if start not in text:
              raise SystemExit('Embedded repair script start marker not found')
          body = text.split(start, 1)[1]
          if end not in body:
              raise SystemExit('Embedded repair script end marker not found')
          body = body.split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          Path('/tmp/repair_client_logos.py').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print('Restored repair script:', len(lines), 'lines')
          PYEXTRACT
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Fetch real logos and generate transparent local assets
        run: python /tmp/repair_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Build project
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix: use individual transparent client logos"
          git push origin main
