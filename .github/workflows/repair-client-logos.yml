name: Repair client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore generator and use the valid WebP source currently rendered by the site
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output(
              ['git', 'show', 'HEAD^:.github/workflows/repair-client-logos.yml'],
              text=True,
          )
          start = "          cat > /tmp/split_client_logos.py <<'PY'\n"
          end = "\n          PY\n"
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace('import io\n', 'import io\nimport re\n')
          old = "raw_b64 = (out / 'clients-strip.b64.txt').read_text(encoding='utf-8').strip()"
          new = "source_ts = (root / 'src/assets/client-logo-transparent-webp-base64.ts').read_text(encoding='utf-8')\nmatch = re.search(r'clientLogoTransparentWebpBase64\\s*=\\s*[\\\"\\\']([^\\\"\\\']+)[\\\"\\\']', source_ts)\nif not match:\n    raise RuntimeError('Could not locate the current valid logo WebP base64 source')\nraw_b64 = match.group(1)"
          if old not in script:
              raise SystemExit('Source line to patch was not found')
          script = script.replace(old, new)
          Path('/tmp/split_client_logos.py').write_text(script, encoding='utf-8')
          print('Generator restored and patched to use the current valid WebP base64 source.')
          PYEXTRACT
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate individual transparent assets
        run: python /tmp/split_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Build project
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix: use individual transparent client logos"
          git push origin main
