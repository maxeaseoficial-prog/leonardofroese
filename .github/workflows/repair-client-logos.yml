name: Repair client logos

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Patch fallback sources for stale reference files
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/repair_client_logos.py')
          text = path.read_text(encoding='utf-8')
          needle = '    candidates = candidate_urls(aliases)\n'
          fallback = '''    fallback_sources = {
              "Claro": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Claro_logo.png",
              "NET": "https://commons.wikimedia.org/wiki/Special:Redirect/file/Logomarca_NET_nova.png",
          }
              if display in fallback_sources:
                  candidates.append(fallback_sources[display])
          '''
          fallback = fallback.replace('          }\n              if', '          }\n    if').replace('\n                  candidates.append', '\n        candidates.append')
          if needle not in text:
              raise SystemExit('Could not patch fallbacks')
          path.write_text(text.replace(needle, needle + fallback, 1), encoding='utf-8')
          PY
      - name: Generate individual local logos
        run: python .github/scripts/repair_client_logos.py
      - name: Restore temporary generator patch
        if: always()
        run: git checkout -- .github/scripts/repair_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit repaired section
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
