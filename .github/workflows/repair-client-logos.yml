name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install image and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Normalize legacy migration source
        run: |
          bun -e '
            const modules = await Promise.all(
              Array.from({ length: 8 }, (_, i) => import(`./src/assets/client-logo-strip/chunk${i}.ts`)),
            );
            const encoded = modules.map((mod) => mod.default).join("");
            if (!encoded.startsWith("UklG")) throw new Error("Reconstructed payload is not WebP base64");
            await Bun.write("public/client-logos/clients-strip.b64.txt", encoded);
            console.log(`Reconstructed WebP migration source from ${modules.length} chunks: ${encoded.length} base64 chars`);
          '

      - name: Extract individual transparent client logos
        run: python .github/scripts/extract_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
