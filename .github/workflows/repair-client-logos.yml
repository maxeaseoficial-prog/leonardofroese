name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Normalize legacy migration source
        run: |
          python - <<'PY'
          import base64
          import re
          from pathlib import Path

          chunks_dir = Path("src/assets/client-logo-strip")
          target = Path("public/client-logos/clients-strip.b64.txt")
          parts = []
          for path in sorted(
              chunks_dir.glob("chunk*.ts"),
              key=lambda p: int(re.search(r"(\d+)", p.stem).group(1)),
          ):
              text = path.read_text(encoding="utf-8")
              match = re.search(r'const\s+chunk\s*=\s*"([A-Za-z0-9+/=]+)"', text)
              if not match:
                  raise SystemExit(f"Could not parse {path}")
              parts.append(match.group(1))
          if not parts:
              raise SystemExit("No legacy WebP chunks found")
          encoded = "".join(parts)
          raw = base64.b64decode(encoded, validate=True)
          if not raw.startswith(b"RIFF") or b"WEBP" not in raw[:16]:
              raise SystemExit("Reconstructed migration source is not a valid WebP container")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(encoded, encoding="utf-8")
          print(f"Reconstructed WebP migration source from {len(parts)} chunks: {len(encoded)} base64 chars")
          PY

      - name: Extract individual transparent client logos
        run: python .github/scripts/extract_client_logos.py

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
