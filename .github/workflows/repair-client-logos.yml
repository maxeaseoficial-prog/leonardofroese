name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install validation tooling
        run: python -m pip install --disable-pip-version-check pillow selenium requests beautifulsoup4

      - name: Build independent transparent local logo assets
        run: |
          for attempt in 1 2 3 4; do
            echo "Logo extraction attempt $attempt/4"
            if python .github/scripts/migrate_client_logos.py; then
              exit 0
            fi
            if [ "$attempt" = "4" ]; then
              exit 1
            fi
            sleep 6
          done

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate desktop, tablet, mobile and Raio-X in browser
        run: |
          bunx vite dev --host 127.0.0.1 --port 4173 > /tmp/vite-browser.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            if [ "$i" = 30 ]; then cat /tmp/vite-browser.log; exit 1; fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Remove one-off repair tooling
        run: |
          rm -f .github/scripts/migrate_client_logos.py
          rm -f .github/scripts/validate_client_logos.py
          rm -f .github/workflows/repair-client-logos.yml

      - name: Commit final repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: use individual transparent client logos"
          git push origin main
