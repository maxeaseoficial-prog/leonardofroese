name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install image and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Recover complete legacy WebP migration source
        run: |
          python - <<'PY'
          import base64
          import io
          import json
          import re
          from pathlib import Path
          from PIL import Image

          chunks_dir = Path("src/assets/client-logo-strip")
          parts = []
          for i in range(8):
              path = chunks_dir / f"chunk{i}.ts"
              text = path.read_text(encoding="utf-8")
              literals = re.findall(r'"(?:\\.|[^"\\])*"', text, flags=re.S)
              candidates = []
              for literal in literals:
                  try:
                      value = json.loads(literal)
                  except Exception:
                      continue
                  if len(value) >= 1000 and re.fullmatch(r"[A-Za-z0-9+/=]+", value):
                      candidates.append(value)
              if not candidates:
                  raise SystemExit(f"Could not locate base64 payload in {path}")
              part = max(candidates, key=len)
              parts.append(part)
              print(f"{path.name}: {len(part)} base64 chars")

          encoded = "".join(parts)
          if not encoded.startswith("UklG"):
              raise SystemExit("Reconstructed source does not begin with a WebP RIFF payload")

          # Decode enough of the stream to read the RIFF size, then cut the
          # concatenated legacy payload at the exact canonical WebP length.
          header = base64.b64decode(encoded[:32] + "===")
          if header[:4] != b"RIFF" or header[8:12] != b"WEBP":
              raise SystemExit("Reconstructed source is not a WebP container")
          declared_length = int.from_bytes(header[4:8], "little") + 8
          encoded_length = ((declared_length + 2) // 3) * 4
          if len(encoded) < encoded_length:
              raise SystemExit(
                  f"WebP requires {encoded_length} base64 chars ({declared_length} bytes), "
                  f"but only {len(encoded)} were recovered"
              )

          canonical_encoded = encoded[:encoded_length]
          raw = base64.b64decode(canonical_encoded, validate=True)
          if len(raw) != declared_length:
              raise SystemExit(
                  f"Decoded WebP length mismatch: expected {declared_length}, got {len(raw)}"
              )

          image = Image.open(io.BytesIO(raw))
          image.load()
          print(
              f"Recovered canonical WebP: {image.width}x{image.height}, "
              f"{declared_length} bytes / {encoded_length} base64 chars"
          )

          target = Path("public/client-logos/clients-strip.b64.txt")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(canonical_encoded, encoding="utf-8")
          PY
          rm -f src/assets/client-logo-transparent-webp-base64.ts

      - name: Extract individual transparent client logos
        run: python .github/scripts/extract_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
