name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install image and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Recover the complete legacy WebP migration source
        run: |
          bun -e '
            const modules = await Promise.all(
              Array.from({ length: 8 }, (_, i) => import(`./src/assets/client-logo-strip/chunk${i}.ts`)),
            );
            const parts = modules.map((mod, i) => {
              const value = String(mod.default ?? "").replace(/\s+/g, "");
              const padPositions = [...value].flatMap((char, index) => char === "=" ? [index] : []);
              const invalid = [...value].filter((char) => !/[A-Za-z0-9+/=]/.test(char)).length;
              console.log(`chunk${i}: ${value.length} chars, padding=${JSON.stringify(padPositions)}, invalid=${invalid}, start=${value.slice(0, 8)}, end=${value.slice(-8)}`);
              return value;
            });
            const joined = parts.join("");
            const dataChars = joined.replace(/[^A-Za-z0-9+/]/g, "");
            if (!dataChars.startsWith("UklG")) throw new Error("Recovered payload does not start with RIFF/WebP base64");

            const header = Buffer.from(dataChars.slice(0, 32), "base64");
            if (header.toString("ascii", 0, 4) !== "RIFF" || header.toString("ascii", 8, 12) !== "WEBP") {
              throw new Error("Recovered payload is not a WebP container");
            }
            const byteLength = header.readUInt32LE(4) + 8;
            const nonPaddingChars = Math.ceil((byteLength * 8) / 6);
            if (dataChars.length < nonPaddingChars) {
              throw new Error(`WebP requires ${nonPaddingChars} data chars but only ${dataChars.length} were recovered`);
            }
            const payload = dataChars.slice(0, nonPaddingChars);
            const padding = "=".repeat((4 - (payload.length % 4)) % 4);
            const canonical = payload + padding;
            const bytes = Buffer.from(canonical, "base64");
            if (bytes.length !== byteLength) {
              throw new Error(`Decoded WebP length mismatch: expected ${byteLength}, got ${bytes.length}`);
            }
            await Bun.write("public/client-logos/clients-strip.b64.txt", canonical);
            console.log(`Recovered canonical WebP: ${byteLength} bytes / ${canonical.length} base64 chars`);
          '

      - name: Extract individual transparent client logos
        run: python .github/scripts/extract_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
