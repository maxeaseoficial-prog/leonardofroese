name: Repair client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' && github.event.head_commit.message == 'chore: generate individual client logos' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4
      - name: Fetch and normalize real client logos
        shell: bash
        run: |
          cat > /tmp/repair_client_logos.py <<'PY'
          from __future__ import annotations
          import io
          import os
          import re
          import shutil
          import unicodedata
          from collections import deque
          from pathlib import Path
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup
          from PIL import Image, ImageStat

          ROOT = Path.cwd()
          OUT = ROOT / 'public' / 'client-logos'
          OUT.mkdir(parents=True, exist_ok=True)

          targets = [
              ('Claro', 'claro', ['claro']),
              ('NET', 'net', ['net']),
              ('Megasom', 'megasom', ['logo megasom sem fundo', 'megasom']),
              ('Leo Madeiras', 'leo-madeiras', ['leo madeiras']),
              ('Procria', 'procria', ['procria']),
              ('LEGO', 'lego', ['lego']),
              ('Maxvinil', 'maxvinil', ['maxvinil']),
              ('Tupperware', 'tupperware', ['tupperware']),
              ('Águas de Sorriso', 'aguas-de-sorriso', ['aguas de sorriso']),
              ('Aliança', 'alianca', ['alianca']),
              ('Campo Solar', 'campo-solar', ['campo solar']),
              ('Cobertura Imasa', 'cobertura-imasa', ['cobertura imasa']),
              ('Eletricidade Paraense', 'eletricidade-paraense', ['eletricidade paraense']),
              ('Fatex', 'fatex', ['fatex']),
              ('Frota', 'frota', ['frota']),
              ('Octech', 'octech', ['octech']),
              ('Pantanal', 'pantanal', ['pantanal']),
              ('Tempermat', 'tempermat', ['tempermat']),
              ('Prime Lente', 'prime-lente', ['prime lente logo gradual', 'prime lente', 'prime-lente-logo-gradual']),
              ('Trevo', 'trevo', ['trevo']),
          ]

          def norm(value: str) -> str:
              value = unicodedata.normalize('NFKD', value or '')
              value = ''.join(ch for ch in value if not unicodedata.combining(ch))
              value = value.lower().replace('-', ' ').replace('_', ' ')
              return re.sub(r'[^a-z0-9]+', ' ', value).strip()

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36',
              'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,image/apng,*/*;q=0.8',
          })
          page = session.get('https://calibergestao.com.br/', timeout=45)
          page.raise_for_status()
          soup = BeautifulSoup(page.text, 'html.parser')
          imgs = soup.find_all('img')

          def image_url(img) -> str | None:
              for attr in ('data-lazy-src', 'data-src', 'data-original', 'src'):
                  value = img.get(attr)
                  if value and not value.startswith('data:'):
                      return urljoin(page.url, value)
              for attr in ('data-lazy-srcset', 'srcset'):
                  value = img.get(attr)
                  if value:
                      candidates = [part.strip().split()[0] for part in value.split(',') if part.strip()]
                      if candidates:
                          return urljoin(page.url, candidates[-1])
              return None

          entries = []
          missing = []

          def make_transparent_png(raw: bytes, dest: Path) -> None:
              im = Image.open(io.BytesIO(raw))
              im.load()
              rgba = im.convert('RGBA')
              w, h = rgba.size
              px = rgba.load()
              alpha_values = [px[x, y][3] for x in range(w) for y in range(h)]
              already_transparent = min(alpha_values) < 245

              if not already_transparent:
                  border = []
                  for x in range(w):
                      border.append(px[x, 0][:3]); border.append(px[x, h - 1][:3])
                  for y in range(h):
                      border.append(px[0, y][:3]); border.append(px[w - 1, y][:3])
                  bg = tuple(sorted(c[i] for c in border)[len(border)//2] for i in range(3))
                  deviations = [sum(abs(c[i] - bg[i]) for i in range(3)) / 3 for c in border]
                  uniform_border = sorted(deviations)[int(len(deviations) * 0.9)] < 24
                  near_white = min(bg) >= 225

                  if uniform_border or near_white:
                      threshold = 58 if near_white else 42
                      seen = bytearray(w * h)
                      q = deque()
                      def maybe_add(x: int, y: int) -> None:
                          idx = y * w + x
                          if seen[idx]:
                              return
                          r, g, b, a = px[x, y]
                          dist = ((r-bg[0])**2 + (g-bg[1])**2 + (b-bg[2])**2) ** 0.5
                          if dist <= threshold:
                              seen[idx] = 1
                              q.append((x, y))
                      for x in range(w):
                          maybe_add(x, 0); maybe_add(x, h-1)
                      for y in range(h):
                          maybe_add(0, y); maybe_add(w-1, y)
                      while q:
                          x, y = q.popleft()
                          r, g, b, _ = px[x, y]
                          px[x, y] = (r, g, b, 0)
                          if x: maybe_add(x-1, y)
                          if x+1 < w: maybe_add(x+1, y)
                          if y: maybe_add(x, y-1)
                          if y+1 < h: maybe_add(x, y+1)

              alpha = rgba.getchannel('A')
              bbox = alpha.getbbox()
              if not bbox:
                  raise RuntimeError(f'No visible pixels in {dest.name}')
              rgba = rgba.crop(bbox)
              pad = max(8, int(max(rgba.size) * 0.04))
              canvas = Image.new('RGBA', (rgba.width + pad*2, rgba.height + pad*2), (0,0,0,0))
              canvas.alpha_composite(rgba, (pad, pad))
              canvas.save(dest, 'PNG', optimize=True)
              check = Image.open(dest).convert('RGBA')
              lo, hi = check.getchannel('A').getextrema()
              if lo != 0 or hi == 0 or check.width < 2 or check.height < 2:
                  raise RuntimeError(f'Asset transparency validation failed: {dest.name}, alpha={lo,hi}, size={check.size}')

          candidates = []
          for img in imgs:
              url = image_url(img)
              if not url:
                  continue
              descriptor = ' '.join([
                  img.get('alt') or '', img.get('title') or '', img.get('class') and ' '.join(img.get('class')) or '', url
              ])
              candidates.append((img, url, norm(descriptor)))

          for display, slug, aliases in targets:
              aliases_n = [norm(a) for a in aliases]
              matches = []
              for img, url, descriptor in candidates:
                  score = 0
                  alt_n = norm(img.get('alt') or '')
                  title_n = norm(img.get('title') or '')
                  url_n = norm(url)
                  for alias in aliases_n:
                      if alt_n == alias: score = max(score, 100)
                      elif title_n == alias: score = max(score, 90)
                      elif alias and alias in alt_n: score = max(score, 80)
                      elif alias and alias in title_n: score = max(score, 70)
                      elif alias and alias in url_n: score = max(score, 60)
                      elif alias and alias in descriptor: score = max(score, 50)
                  if score:
                      matches.append((score, url, img.get('alt') or ''))
              if not matches:
                  missing.append(display)
                  continue
              matches.sort(reverse=True)
              _, url, matched_alt = matches[0]
              response = session.get(url, timeout=45, headers={'Referer': page.url})
              response.raise_for_status()
              dest = OUT / f'{slug}.png'
              try:
                  make_transparent_png(response.content, dest)
              except Exception as exc:
                  raise RuntimeError(f'Could not process {display} from {url}: {exc}') from exc
              entries.append((display, slug, url, matched_alt))
              print(f'OK {display}: {url} -> {dest.relative_to(ROOT)}')

          if missing:
              available = sorted({(img.get('alt') or '').strip() for img in imgs if (img.get('alt') or '').strip()})
              print('AVAILABLE ALTS:', available)
              raise RuntimeError('Missing reference logos: ' + ', '.join(missing))
          if len(entries) != len(targets):
              raise RuntimeError(f'Expected {len(targets)} logos, got {len(entries)}')

          tsx = '''import "./client-logos.css";

const clientLogos = [
'''
          for display, slug, _, _ in entries:
              tsx += f'  {{ name: {display!r}, src: "/client-logos/{slug}.png" }},\n'
          tsx += '''] as const;

function LogoGroup({ clone = false }: { clone?: boolean }) {
  return (
    <div className="client-logos-group" aria-hidden={clone || undefined} data-clone={clone || undefined}>
      {clientLogos.map((logo) => (
        <div className="client-logo-item" key={`${clone ? "clone-" : ""}${logo.name}`}>
          <img
            src={logo.src}
            alt={clone ? "" : logo.name}
            aria-hidden={clone || undefined}
            decoding="async"
            draggable={false}
          />
        </div>
      ))}
    </div>
  );
}

export function ClientLogos({ className = "" }: { className?: string }) {
  return (
    <section className={`client-logos ${className}`} aria-label="Parceiros e clientes da Cáliber">
      <div className="client-logos-heading">
        <span>Algumas das empresas que confiam no nosso trabalho</span>
        <h3>Parceiros &amp; Clientes</h3>
      </div>

      <div className="client-logos-viewport">
        <div className="client-logos-track">
          <LogoGroup />
          <LogoGroup clone />
        </div>
      </div>
    </section>
  );
}
'''
          (ROOT / 'src/components/site/client-logos.tsx').write_text(tsx, encoding='utf-8')

          css = r'''.client-logos {
  position: relative;
  width: 100%;
  max-width: 100%;
  overflow: hidden;
}

.client-logos-heading {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
  padding: 0 20px;
}

.client-logos-heading > span {
  color: hsl(var(--primary));
  font-size: 11px;
  font-weight: 650;
  letter-spacing: 0.24em;
  line-height: 1.55;
}

.client-logos-heading h3 {
  max-width: 760px;
  margin: 14px 0 0;
  color: hsl(var(--foreground));
  font-size: clamp(34px, 4vw, 56px);
  line-height: 1;
  font-weight: 750;
  letter-spacing: -0.035em;
  text-wrap: balance;
}

.client-logos-viewport {
  position: relative;
  width: 100%;
  max-width: 100%;
  margin-top: 38px;
  overflow: hidden;
  background: transparent;
  mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 5%, #000 95%, transparent);
}

.client-logos-track {
  display: flex;
  width: max-content;
  max-width: none;
  align-items: center;
  animation: client-logos-marquee 52s linear infinite;
  will-change: transform;
}

.client-logos-group {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: clamp(42px, 4.5vw, 76px);
  padding-right: clamp(42px, 4.5vw, 76px);
}

.client-logo-item {
  display: flex;
  width: clamp(118px, 12vw, 176px);
  height: 76px;
  flex: 0 0 auto;
  align-items: center;
  justify-content: center;
  background: transparent;
}

.client-logo-item img {
  display: block;
  width: auto;
  max-width: 100%;
  height: auto;
  max-height: 68px;
  object-fit: contain;
  background: transparent;
  user-select: none;
}

@media (hover: hover) and (pointer: fine) {
  .client-logos-viewport:hover .client-logos-track {
    animation-play-state: paused;
  }
}

@keyframes client-logos-marquee {
  from { transform: translate3d(-50%, 0, 0); }
  to { transform: translate3d(0, 0, 0); }
}

@media (max-width: 720px) {
  .client-logos-heading { padding-inline: 14px; }
  .client-logos-heading > span {
    max-width: 330px;
    font-size: 9px;
    letter-spacing: 0.17em;
  }
  .client-logos-heading h3 {
    max-width: 340px;
    margin-top: 12px;
    font-size: clamp(32px, 10vw, 42px);
  }
  .client-logos-viewport {
    margin-top: 28px;
    mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 97%, transparent);
  }
  .client-logos-track { animation-duration: 46s; }
  .client-logos-group {
    gap: 30px;
    padding-right: 30px;
  }
  .client-logo-item {
    width: 112px;
    height: 60px;
  }
  .client-logo-item img { max-height: 52px; }
}

@media (prefers-reduced-motion: reduce) {
  .client-logos-viewport {
    overflow: hidden;
    mask-image: none;
    -webkit-mask-image: none;
  }
  .client-logos-track {
    width: 100%;
    max-width: 100%;
    animation: none;
    transform: none;
    will-change: auto;
  }
  .client-logos-group {
    width: 100%;
    flex-wrap: wrap;
    justify-content: center;
    gap: 28px 38px;
    padding-right: 0;
  }
  .client-logos-group[data-clone="true"] { display: none; }
}
'''
          (ROOT / 'src/components/site/client-logos.css').write_text(css, encoding='utf-8')

          obsolete = [
              ROOT / 'src/assets/client-logo-transparent-webp-base64.ts',
              ROOT / 'src/components/site/client-logos-local.ts',
              ROOT / 'src/components/site/client-logos-strip-placeholder.txt',
              ROOT / 'public/client-logos/clients-strip.b64.txt',
              ROOT / 'public/client-logos/README.txt',
          ]
          for path in obsolete:
              if path.exists(): path.unlink()
          chunks = ROOT / 'src/assets/client-logo-strip'
          if chunks.exists(): shutil.rmtree(chunks)

          print(f'Generated {len(entries)} individual transparent PNG assets.')
          PY
          python /tmp/repair_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Validate scope and commit generated assets
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/client-logos src/components/site/client-logos.tsx src/components/site/client-logos.css src/assets/client-logo-transparent-webp-base64.ts src/assets/client-logo-strip src/components/site/client-logos-local.ts src/components/site/client-logos-strip-placeholder.txt
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix: use individual transparent client logos"
          git push origin main
