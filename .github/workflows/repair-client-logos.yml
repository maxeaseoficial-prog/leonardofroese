name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install logo and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium requests beautifulsoup4

      - name: Add resilient source recovery for deleted Cáliber media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/migrate_client_logos.py')
          text = path.read_text(encoding='utf-8')
          old = '''        url = sources[slug]\n        response = session.get(url, timeout=45)\n        response.raise_for_status()\n        if len(response.content) < 100:\n            raise RuntimeError(f"Downloaded image is unexpectedly small: {display_name}")\n'''
          new = '''        url = sources[slug]\n        candidates = []\n        marker = "wp.com/calibergestao.com.br/"\n        origin_url = None\n        if marker in url:\n            direct_path = url.split(marker, 1)[1].split("?", 1)[0]\n            origin_url = f"https://calibergestao.com.br/{direct_path}"\n            candidates.append(origin_url)\n        candidates.append(url)\n\n        # Some old WordPress media referenced by the live Cáliber page was later\n        # deleted from the origin/Jetpack cache. Recover the real historical\n        # file itself from Internet Archive, never from a screenshot. Wayback's\n        # replay resolves each requested date to the closest available capture.\n        if origin_url:\n            for stamp in (\n                "20220301000000",\n                "20220601000000",\n                "20230101000000",\n                "20240101000000",\n                "20250101000000",\n                "20260101000000",\n            ):\n                candidates.append(\n                    f"https://web.archive.org/web/{stamp}id_/{origin_url}"\n                )\n\n        response = None\n        last_error = None\n        for candidate in candidates:\n            try:\n                attempt = session.get(candidate, timeout=60)\n                attempt.raise_for_status()\n                if len(attempt.content) < 100:\n                    raise RuntimeError(f"Downloaded image is unexpectedly small: {display_name}")\n                # Reject archive error/HTML pages before Pillow sees them.\n                content_type = attempt.headers.get("content-type", "").lower()\n                if "text/html" in content_type:\n                    raise RuntimeError(f"HTML returned instead of image: {content_type}")\n                response = attempt\n                url = candidate\n                print(f"DOWNLOAD SOURCE {display_name}: {candidate}")\n                break\n            except Exception as exc:\n                last_error = exc\n                print(f"DOWNLOAD RETRY {display_name}: {candidate} -> {exc}")\n\n        if response is None:\n            raise RuntimeError(f"Could not download {display_name}: {last_error}")\n'''
          if old not in text:
              raise SystemExit('Download block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download real Cáliber logos and create local transparent assets
        run: python .github/scripts/migrate_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Remove one-off repair tooling
        run: |
          rm -f .github/scripts/migrate_client_logos.py
          rm -f .github/scripts/validate_client_logos.py
          rm -f .github/workflows/repair-client-logos.yml

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
