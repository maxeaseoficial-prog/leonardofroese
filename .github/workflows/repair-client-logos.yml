name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Normalize legacy migration source
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          source = Path("src/assets/client-logo-transparent-webp-base64.ts")
          target = Path("public/client-logos/clients-strip.b64.txt")
          text = source.read_text(encoding="utf-8")
          match = re.search(r'"(UklG[A-Za-z0-9+/=]+)"', text)
          if not match:
              raise SystemExit("Could not locate the embedded WebP migration source")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(match.group(1), encoding="utf-8")
          print(f"Normalized embedded WebP source: {len(match.group(1))} base64 chars")
          PY

      - name: Extract individual transparent client logos
        run: python .github/scripts/extract_client_logos.py

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898242+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
