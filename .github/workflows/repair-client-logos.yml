name: Repair client logos

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow requests beautifulsoup4

      - name: Add fallback for the missing NET source asset
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/repair_client_logos.py')
          text = path.read_text(encoding='utf-8')
          needle = '    candidates = candidate_urls(aliases)\n'
          replacement = needle + '    if display == "NET":\n        candidates.append("https://commons.wikimedia.org/wiki/Special:Redirect/file/Logomarca_NET_nova.png")\n'
          if needle not in text:
              raise SystemExit('Could not patch NET fallback')
          path.write_text(text.replace(needle, replacement, 1), encoding='utf-8')
          PY

      - name: Generate individual local logos
        run: python .github/scripts/repair_client_logos.py

      - name: Restore temporary generator patch
        if: always()
        run: git checkout -- .github/scripts/repair_client_logos.py

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
