name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install logo and browser tooling
        run: python -m pip install --disable-pip-version-check pillow selenium requests beautifulsoup4

      - name: Add resilient source recovery for deleted Cáliber media
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/migrate_client_logos.py')
          text = path.read_text(encoding='utf-8')
          old = '''        url = sources[slug]\n        response = session.get(url, timeout=45)\n        response.raise_for_status()\n        if len(response.content) < 100:\n            raise RuntimeError(f"Downloaded image is unexpectedly small: {display_name}")\n'''
          new = '''        url = sources[slug]\n        candidates = []\n        marker = "wp.com/calibergestao.com.br/"\n        origin_url = None\n        if marker in url:\n            direct_path = url.split(marker, 1)[1].split("?", 1)[0]\n            origin_url = f"https://calibergestao.com.br/{direct_path}"\n            candidates.append(origin_url)\n        candidates.append(url)\n\n        # WordPress can retain generated image sizes even when an original media\n        # path has disappeared. Ask the site's own REST media index for the real\n        # attachment and every generated size before consulting web archives.\n        try:\n            media_response = session.get(\n                "https://calibergestao.com.br/wp-json/wp/v2/media",\n                params={"search": display_name, "per_page": 100},\n                timeout=60,\n            )\n            media_response.raise_for_status()\n            media_items = media_response.json()\n            print(f"WP MEDIA {display_name}: items={len(media_items)}")\n            for media in media_items:\n                print(\n                    f"WP MEDIA ITEM {display_name}: id={media.get('id')} "\n                    f"slug={media.get('slug')} source={media.get('source_url')}"\n                )\n                source_url = media.get("source_url")\n                if source_url:\n                    candidates.append(source_url)\n                guid = media.get("guid", {}).get("rendered")\n                if guid:\n                    candidates.append(guid)\n                sizes = media.get("media_details", {}).get("sizes", {})\n                for size_name, size_data in sizes.items():\n                    size_url = size_data.get("source_url")\n                    if size_url:\n                        print(\n                            f"WP SIZE {display_name}: {size_name} "\n                            f"{size_data.get('width')}x{size_data.get('height')} {size_url}"\n                        )\n                        candidates.append(size_url)\n        except Exception as exc:\n            print(f"WP MEDIA LOOKUP {display_name} FAILED: {exc}")\n\n        if origin_url:\n            try:\n                archive_index = session.get(\n                    "https://arquivo.pt/textsearch",\n                    params={\n                        "versionHistory": origin_url,\n                        "maxItems": 50,\n                        "prettyPrint": "false",\n                    },\n                    timeout=60,\n                )\n                archive_index.raise_for_status()\n                archive_data = archive_index.json()\n                archive_items = archive_data.get("response_items", [])\n                print(\n                    f"ARQUIVO.PT {display_name}: "\n                    f"captures={len(archive_items)} total={archive_data.get('total_items')}"\n                )\n                for item in archive_items:\n                    status = str(item.get("statusCode", item.get("status", "")))\n                    mime = str(item.get("mimeType", "")).lower()\n                    replay = item.get("linkToOriginalFile") or item.get("linkToNoFrame")\n                    if status == "200" and replay and (mime.startswith("image/") or not mime):\n                        candidates.append(replay)\n            except Exception as exc:\n                print(f"ARQUIVO.PT LOOKUP {display_name} FAILED: {exc}")\n\n            for stamp in (\n                "20220301000000",\n                "20220601000000",\n                "20230101000000",\n                "20240101000000",\n                "20250101000000",\n                "20260101000000",\n            ):\n                candidates.append(\n                    f"https://web.archive.org/web/{stamp}id_/{origin_url}"\n                )\n\n        candidates = list(dict.fromkeys(candidates))\n        response = None\n        last_error = None\n        for candidate in candidates:\n            try:\n                attempt = session.get(candidate, timeout=60)\n                attempt.raise_for_status()\n                if len(attempt.content) < 100:\n                    raise RuntimeError(f"Downloaded image is unexpectedly small: {display_name}")\n                content_type = attempt.headers.get("content-type", "").lower()\n                if "text/html" in content_type:\n                    raise RuntimeError(f"HTML returned instead of image: {content_type}")\n                probe = Image.open(io.BytesIO(attempt.content))\n                probe.verify()\n                response = attempt\n                url = candidate\n                print(f"DOWNLOAD SOURCE {display_name}: {candidate}")\n                break\n            except Exception as exc:\n                last_error = exc\n                print(f"DOWNLOAD RETRY {display_name}: {candidate} -> {exc}")\n\n        if response is None:\n            raise RuntimeError(f"Could not download {display_name}: {last_error}")\n'''
          if old not in text:
              raise SystemExit('Download block not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Download real Cáliber logos and create local transparent assets
        run: python .github/scripts/migrate_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Remove one-off repair tooling
        run: |
          rm -f .github/scripts/migrate_client_logos.py
          rm -f .github/scripts/validate_client_logos.py
          rm -f .github/workflows/repair-client-logos.yml

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
