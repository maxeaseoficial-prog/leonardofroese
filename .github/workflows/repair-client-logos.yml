name: Repair client logos

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: oven-sh/setup-bun@v2

      - name: Install logo tooling
        run: python -m pip install --disable-pip-version-check pillow selenium

      - name: Restore the complete approved source strip
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/migrate_client_logos.py')
          text = path.read_text(encoding='utf-8')
          start = text.find('def load_consistent_legacy_strip() -> Image.Image:\n')
          end = text.find('\ndef color_distance', start)
          if start < 0 or end < 0:
              raise SystemExit('Source loader function not found')

          replacement = '''def load_consistent_legacy_strip() -> Image.Image:
              encoded = subprocess.check_output(
                  [
                      "git",
                      "show",
                      "907f0978d04602a1a03ad4da4f44396f4901ecb9:public/client-logos/clients-strip.b64.txt",
                  ],
                  cwd=ROOT,
                  text=True,
              )
              encoded = "".join(encoded.split())
              raw = base64.b64decode(encoded, validate=True)
              source = Image.open(io.BytesIO(raw))
              source_format = source.format
              source.load()
              image = source.convert("RGBA")
              if image.width % len(LOGOS) != 0:
                  raise RuntimeError(
                      f"Unexpected source width {image.width} for {len(LOGOS)} logo cells"
                  )
              if image.height < 20:
                  raise RuntimeError(f"Unexpected source height: {image.height}")
              print(
                  f"COMPLETE APPROVED SOURCE: format={source_format}; "
                  f"size={image.width}x{image.height}; bytes={len(raw)}; "
                  f"cell_width={image.width // len(LOGOS)}"
              )
              return image
          '''
          replacement = '\n'.join(
              line[12:] if line.startswith('            ') else line
              for line in replacement.splitlines()
          ).strip() + '\n\n'
          text = text[:start] + replacement + text[end + 1:]
          path.write_text(text, encoding='utf-8')
          PY

      - name: Recover original logos and create transparent local assets
        run: python .github/scripts/migrate_client_logos.py

      - name: Install dependencies and build
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Validate client logos in browser
        run: |
          bun run preview --host 127.0.0.1 --port 4173 > /tmp/vite-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              cat /tmp/vite-preview.log
              exit 1
            fi
            sleep 1
          done
          PREVIEW_URL=http://127.0.0.1:4173 python .github/scripts/validate_client_logos.py

      - name: Upload validation screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: client-logo-validation
          path: /tmp/client-logo-validation
          if-no-files-found: ignore

      - name: Remove one-off repair tooling
        run: |
          rm -f .github/scripts/migrate_client_logos.py
          rm -f .github/scripts/validate_client_logos.py
          rm -f .github/workflows/repair-client-logos.yml

      - name: Commit repaired section
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "fix: use individual transparent client logos"
          git push origin main
