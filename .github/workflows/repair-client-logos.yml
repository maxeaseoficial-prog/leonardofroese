name: Repair client logos

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore generator and reconstruct complete source chunks
        shell: bash
        run: |
          python - <<'PYEXTRACT'
          import subprocess
          from pathlib import Path

          text = subprocess.check_output(
              ['git', 'show', '03a1c3c28e1c5165b2a94316b3eb9a31b18a5cd7:.github/workflows/repair-client-logos.yml'],
              text=True,
          )
          start = "          cat > /tmp/split_client_logos.py <<'PY'\n"
          end = "\n          PY\n"
          body = text.split(start, 1)[1].split(end, 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in body.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace('import io\n', 'import io\nimport re\n')
          old = "raw_b64 = (out / 'clients-strip.b64.txt').read_text(encoding='utf-8').strip()"
          new = "chunk_dir = root / 'src/assets/client-logo-strip'\nchunk_files = sorted(chunk_dir.glob('chunk*.ts'), key=lambda p: int(re.search(r'chunk(\\d+)', p.name).group(1)))\nif not chunk_files:\n    raise RuntimeError('No source chunks found')\nparts = []\nfor chunk_file in chunk_files:\n    chunk_text = chunk_file.read_text(encoding='utf-8')\n    match = re.search(r'\"([^\"]+)\"', chunk_text)\n    if not match:\n        raise RuntimeError(f'Could not parse {chunk_file.name}: {chunk_text[:80]!r}')\n    parts.append(match.group(1))\nraw_b64 = ''.join(parts)\nprint(f'Reconstructed source from {len(parts)} chunks; base64 chars={len(raw_b64)}')"
          if old not in script:
              raise SystemExit('Source line to patch was not found')
          script = script.replace(old, new)
          Path('/tmp/split_client_logos.py').write_text(script, encoding='utf-8')
          print('Generator restored and patched to concatenate the eight source chunks.')
          PYEXTRACT
      - name: Install image tooling
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate individual transparent assets
        run: python /tmp/split_client_logos.py
      - uses: oven-sh/setup-bun@v2
      - name: Build project
        run: |
          bun install --frozen-lockfile
          bun run build
      - name: Commit generated repair
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No generated changes"; exit 1; }
          git commit -m "fix: use individual transparent client logos"
          git push origin main
